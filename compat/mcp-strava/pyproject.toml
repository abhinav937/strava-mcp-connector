[project]
name = "mcp-strava"
version = "0.2.1"
description = "Box shim: makes the `mcp-strava` command (what the user-strava-local host runs via `uv tool uvx mcp-strava`) start strava-mcp-connector in stdio mode"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "strava-mcp-connector==0.2.1",
]

[project.scripts]
mcp-strava = "mcp_strava_compat:main"
strava-mcp = "mcp_strava_compat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_strava_compat"]
